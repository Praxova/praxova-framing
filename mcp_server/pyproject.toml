[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxova-framing-mcp"
version = "0.3.4"
description = "MCP server fronting the Praxova Framing Blender add-on - drive lumber, sheets, panels, OC duplication, fill, and cut-list generation from an LLM agent"
readme = "README.md"
authors = [{ name = "Alton Lord", email = "adlord@gmail.com" }]
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
keywords = ["mcp", "blender", "framing", "construction", "praxova"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
praxova-framing-mcp = "praxova_framing_mcp.__main__:main"

[project.urls]
Homepage = "https://praxova.ai"
Repository = "https://github.com/Praxova/praxova-framing"

[tool.hatch.build.targets.wheel]
packages = ["praxova_framing_mcp"]
